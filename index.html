<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2b1c33">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https:; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>متابعة الكاشير</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="loginView" class="card login">
      <div class="logo">📊</div>
      <h1>لوحة المدير</h1>
      <p>سجّل الدخول لمتابعة المحل من أي مكان</p>
      <form id="loginForm" method="post" action="." novalidate>
        <label>البريد الإلكتروني<input id="email" name="email" type="text" inputmode="email" autocomplete="username" placeholder="manager.demo.2026@example.com" required></label>
        <label>كلمة المرور<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" id="loginButton">دخول</button>
      </form>
      <div id="loginError" class="error"></div>
    </section>

    <section id="dashboard" class="hidden">
      <header>
        <div><small>متابعة حية</small><h1 id="shopName">المحل</h1></div>
        <div class="header-actions">
          <span id="liveBadge" class="live-badge">تحديث تلقائي</span>
          <button id="logoutButton" class="secondary">خروج</button>
        </div>
      </header>

      <div class="stats">
        <article class="card"><span>مبيعات اليوم</span><strong id="todaySales">—</strong></article>
        <article class="card"><span>فواتير اليوم</span><strong id="todayCount">—</strong></article>
        <article class="card"><span>ورديات مفتوحة</span><strong id="openCount">—</strong></article>
        <article class="card"><span>متصل الآن</span><strong id="onlineCount">—</strong></article>
      </div>

      <p class="hint">هذه المتابعة تعرض عمليات العمل وآخر نشاط مسجّل، وليست بثاً لشاشة الجهاز.</p>

      <div class="section-title">
        <h2>الكاشير الآن</h2>
        <div class="toolbar">
          <select id="cashierFilter" aria-label="تصفية حسب الكاشير">
            <option value="all">كل الكاشيرات</option>
          </select>
          <button id="refreshButton" class="secondary">تحديث</button>
        </div>
      </div>
      <div id="cashierList" class="cashier-list"></div>

      <div class="section-title">
        <h2>الورديات والمبيعات</h2>
      </div>
      <div id="shiftList" class="shift-list"></div>
      <p id="lastRefresh" class="muted"></p>
    </section>
  </main>

  <dialog id="closeDialog">
    <form id="closeForm" method="dialog">
      <h2>إغلاق الوردية عن بُعد</h2>
      <p id="closeShiftName"></p>
      <label>النقدية الفعلية في الدرج (اختياري)
        <input id="actualCash" type="number" min="0" step="0.01" placeholder="يُترك فارغاً للإغلاق على المتوقع">
      </label>
      <label>سبب الإغلاق<input id="closeReason" maxlength="200" placeholder="مثال: نهاية اليوم"></label>
      <div class="dialog-actions">
        <button type="button" id="cancelClose" class="secondary">تراجع</button>
        <button type="submit" class="danger">تأكيد الإغلاق</button>
      </div>
      <div id="closeError" class="error"></div>
    </form>
  </dialog>

  <script src="boot.js?v=6"></script>
  <script type="module" src="app.js?v=6"></script>
</body>
</html>
